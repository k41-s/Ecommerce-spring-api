<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="/js/auth.js"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>System Logs</h2>
            <div>
                <button id="refreshBtn" class="btn btn-primary me-2">Refresh Logs</button>
                <button onclick="logout()" class="btn btn-outline-danger">Logout</button>
            </div>
        </div>

        <table class="table table-striped table-hover bg-white shadow-sm">
            <thead>
            <tr>
                <th>ID</th>
                <th>Timestamp</th>
                <th>Level</th>
                <th>Message</th>
            </tr>
            </thead>
            <tbody id="logTableBody">
            </tbody>
        </table>
    </div>

    <script>
        async function fetchLogs() {
            const token = localStorage.getItem('token');

            if (!token) {
                window.location.href = '/admin/login';
                return;
            }

            try {
                const response = await fetchWithAuth('/api/logs', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const logs = await response.json();
                    const tbody = document.getElementById('logTableBody');
                    tbody.innerHTML = '';

                    logs.forEach(log => {
                        const row = `<tr>
                                <td>${log.id}</td>
                                <td>${new Date(log.timestamp).toLocaleString()}</td>
                                <td>${log.level}</td>
                                <td>${log.message}</td>
                            </tr>`;
                        tbody.innerHTML += row;
                    });
                } else if (response.status === 403) {
                    alert("Access Denied: Only Admins can view logs.");
                    window.location.href = '/admin/login';
                }

            } catch (error) {
                console.error("Error fetching logs:", error);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchLogs);

        fetchLogs();
    </script>
</body>
</html>
